{% extends 'dashboard/doctor/base_doctor.html' %}
{% load static %}

{% block title %}Edit Patient Consultation - Limbe Regional Hospital{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/register_staff.css' %}">
{% endblock %}

{% block content %}
<div class="content-header">
    <h2><i class="fas fa-edit"></i> Edit Patient Consultation</h2>
</div>

<div class="content-body">
    
        <form method="POST"  >
        {% csrf_token %}
 

            <div class="form-group">
                <label for="diagnosis">Diagnosis:</label>
                <input type="text" id="diagnosis" name="diagnosis" value="{{ consultation.diagnosis }}" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="treatment">Treatment:</label>
                <input type="text" id="treatment" name="treatment" value="{{ consultation.treatment }}" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="prescription">Prescription:</label>
                <input type="text" id="prescription" name="prescription" value="{{ consultation.prescription }}" class="form-control" required>
            </div>


            <!-- Form Actions -->
            <div class="form-actions">
                <!-- Save Changes Button -->
                <button type="submit" class="submit-btn">
                    <i class="fas fa-save"></i> Save Changes
                </button>
                
                <!-- Back to Screening Management Button -->
                <a href="{% url 'patient_consultation_management' %}" class="btn-back">
                    <i class="fas fa-arrow-left"></i> Back to Consultation Management
                </a>
            </div>



    </form>
</div>
{% endblock %}
